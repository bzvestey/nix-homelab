name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64-linux
          - runner: ubuntu-24.04-arm
            architecture: aarch64-linux
    name: ${{ matrix.architecture }} checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Check formatting
        run: nix fmt -- --check .
      - name: Run statix
        run: nix run .#statix -- check .
      - name: Run deadnix
        run: nix run .#deadnix -- --fail .
      - name: Check flake
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/flake-check.log"
          set +e
          if [[ '${{ matrix.architecture }}' == x86_64-linux ]]; then
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              nix flake check --show-trace --option max-jobs 1 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
            else
              {
                nix flake check --no-build --show-trace
                nix build \
                  ".#checks.${{ matrix.architecture }}.installers" \
                  ".#checks.${{ matrix.architecture }}.secrets" \
                  ".#checks.${{ matrix.architecture }}.common-host" \
                  ".#checks.${{ matrix.architecture }}.evaluation" \
                  ".#checks.${{ matrix.architecture }}.inventory" \
                  ".#checks.${{ matrix.architecture }}.inventory-fixtures"
              } 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              {
                echo "## ${{ matrix.architecture }} checks: VM checks not executed"
                echo
                echo "The runner did not provide readable and writable /dev/kvm."
                echo "VM checks were not executed due to missing KVM; this path is not a full test-suite success."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              nix flake check --no-build --show-trace
              nix build \
                .#checks.aarch64-linux.installers \
                .#checks.aarch64-linux.secrets \
                .#checks.aarch64-linux.common-host \
                .#checks.aarch64-linux.evaluation \
                .#checks.aarch64-linux.inventory \
                .#checks.aarch64-linux.inventory-fixtures
            } 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
          fi
          set -e
          if (( status != 0 )); then
            {
              echo "## ${{ matrix.architecture }} native flake check failure"
              echo
              echo 'Last 200 lines (bounded to 60,000 bytes):'
              echo '```text'
              tail -n 200 "$log" | tail -c 60000
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 40 "$log" | tail -c 3500)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=%s native flake check failure::%s\n' \
              '${{ matrix.architecture }}' "$diagnostic"
            exit "$status"
          fi

  host-closures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: framework-01
          - runner: ubuntu-24.04
            host: framework-02
          - runner: ubuntu-24.04
            host: framework-03
          - runner: ubuntu-24.04-arm
            host: observability-pi
          - runner: ubuntu-24.04-arm
            host: services-pi
    name: ${{ matrix.host }} closure (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build ${{ matrix.host }} closure
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/${{ matrix.host }}-closure.log"
          set +e
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo "## ${{ matrix.host }} native closure build failure"
              echo
              echo 'Last 200 lines (bounded to 60,000 bytes):'
              echo '```text'
              tail -n 200 "$log" | tail -c 60000
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 40 "$log" | tail -c 3500)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=%s native closure build failure::%s\n' \
              '${{ matrix.host }}' "$diagnostic"
            exit "$status"
          fi
