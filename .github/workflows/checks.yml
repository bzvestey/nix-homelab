name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      closures: ${{ steps.select.outputs.closures }}
      has_checks: ${{ steps.select.outputs.has_checks }}
      has_closures: ${{ steps.select.outputs.has_closures }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI selection
        run: python3 .github/tests/ci-scope.py
      - id: select
        name: Select affected validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-scope.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"

  checks:
    needs: scope
    if: needs.scope.outputs.has_checks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.checks) }}
    name: ${{ matrix.architecture }} checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Check formatting
        run: nix fmt -- --check .
      - name: Run statix
        run: nix run .#statix -- check .
      - name: Run deadnix
        run: nix run .#deadnix -- --fail .
      - name: Check flake
        id: flake-check
        run: |
          set -o pipefail
          diagnostics="$RUNNER_TEMP/check-diagnostics"
          mkdir -p "$diagnostics"
          date -u --iso-8601=seconds > "$diagnostics/started-at"
          log="$diagnostics/flake-check.log"
          # Stream samples as well as saving them: a lost runner cannot upload artifacts.
          # Never collect environment values or process command arguments.
          (
            set +e
            sleep_pid=
            trap 'kill "${sleep_pid:-}" 2>/dev/null || true; exit 0' INT TERM
            echo 'Nix resource settings (command-line overrides are shown in the build command):'
            nix config show 2>/dev/null | sed -n -E '/^(cores|max-jobs|system) = /p'
            while true; do
              echo "=== Resource sample $(date -u --iso-8601=seconds) ==="
              free -m
              df -h / /nix "$RUNNER_TEMP"
              for pressure in /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io; do
                echo "$pressure"
                cat "$pressure"
              done
              ps -eo pid,ppid,comm,rss,pcpu --sort=-rss | head -n 16
              sleep 30 &
              sleep_pid=$!
              wait "$sleep_pid"
            done
          ) > >(tee "$diagnostics/resources.log") 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          set +e
          if [[ '${{ matrix.architecture }}' == x86_64-linux ]]; then
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              {
                # Release the full-flake evaluation heap before starting VMs.
                # Build every native check from its drv path, without re-evaluating
                # the flake in the process that waits for those builds.
                nix flake check --no-build --show-trace &&
                  nix eval --raw '.#checks.x86_64-linux' --apply \
                    'checks: builtins.concatStringsSep "\n" (builtins.map (check: check.drvPath + "^*") (builtins.attrValues checks))' \
                    > "$diagnostics/check-installables" &&
                  mapfile -t check_installables < "$diagnostics/check-installables" &&
                  nix build --no-link --show-trace --option max-jobs 1 --cores 2 "${check_installables[@]}"
              } 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
            else
              {
                nix flake check --no-build --show-trace
                # This is exactly the non-KVM check set. ingress, storage,
                # observability, and telemetry-agent each require both kvm and
                # nixos-test; secrets-vm remains separately KVM-backed. Those
                # checks are still mandatory on a KVM-capable/local runner.
                nix build \
                  ".#checks.${{ matrix.architecture }}.installers" \
                  ".#checks.${{ matrix.architecture }}.secrets" \
                  ".#checks.${{ matrix.architecture }}.common-host" \
                  ".#checks.${{ matrix.architecture }}.evaluation" \
                  ".#checks.${{ matrix.architecture }}.inventory" \
                  ".#checks.${{ matrix.architecture }}.inventory-fixtures" \
                  ".#checks.${{ matrix.architecture }}.no-legacy-hostnames"
              } 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              {
                echo "## ${{ matrix.architecture }} checks: VM checks not executed"
                echo
                echo "The runner did not provide readable and writable /dev/kvm."
                echo "VM checks were not executed due to missing KVM; this path is not a full test-suite success."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              nix flake check --no-build --show-trace
              # Keep this list identical to the x86 non-KVM fallback above.
              # The omitted VM checks remain required on a KVM-capable/local
              # runner; hosted ARM does not satisfy requiredSystemFeatures.
              nix build \
                .#checks.aarch64-linux.installers \
                .#checks.aarch64-linux.secrets \
                .#checks.aarch64-linux.common-host \
                .#checks.aarch64-linux.evaluation \
                .#checks.aarch64-linux.inventory \
                .#checks.aarch64-linux.inventory-fixtures \
                .#checks.aarch64-linux.no-legacy-hostnames
            } 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
          fi
          set -e
          if (( status != 0 )); then
            {
              echo "## ${{ matrix.architecture }} native flake check failure"
              echo
              echo 'Last 200 lines (bounded to 60,000 bytes):'
              echo '```text'
              tail -n 200 "$log" | tail -c 60000
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 40 "$log" | tail -c 3500)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=%s native flake check failure::%s\n' \
              '${{ matrix.architecture }}' "$diagnostic"
            exit "$status"
          fi
      - name: Collect flake-check diagnostics
        if: ${{ always() && steps.flake-check.outcome != '' && steps.flake-check.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          diagnostics="$RUNNER_TEMP/check-diagnostics"
          since=$(cat "$diagnostics/started-at")
          { sudo -n journalctl -k --since "$since" -n 200 --no-pager; } > "$diagnostics/kernel.log" 2>&1 || true
          { sudo -n journalctl -u nix-daemon.service --since "$since" -n 200 --no-pager; } > "$diagnostics/nix-daemon.log" 2>&1 || true
      # For runner-internal diagnostics, select "Enable debug logging" when rerunning.
      # Neither always() nor upload-artifact can recover files after total runner loss.
      - name: Upload flake-check diagnostics
        if: ${{ always() && steps.flake-check.outcome != '' && steps.flake-check.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flake-diagnostics-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  host-closures:
    needs: scope
    if: needs.scope.outputs.has_closures == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.closures) }}
    name: ${{ matrix.host }} closure (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build ${{ matrix.host }} closure
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/${{ matrix.host }}-closure.log"
          set +e
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo "## ${{ matrix.host }} native closure build failure"
              echo
              echo 'Last 200 lines (bounded to 60,000 bytes):'
              echo '```text'
              tail -n 200 "$log" | tail -c 60000
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 40 "$log" | tail -c 3500)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=%s native closure build failure::%s\n' \
              '${{ matrix.host }}' "$diagnostic"
            exit "$status"
          fi
      - name: Prebuild remaining node-02 applications
        if: matrix.host == 'hl-node-02'
        run: nix build .#preparedConfigurations.hl-node-02-remaining.config.system.build.toplevel --no-link
      - name: Prebuild temporary lightweight hosting
        if: matrix.host == 'hl-node-03'
        run: nix build .#preparedConfigurations.hl-node-03-staging.config.system.build.toplevel --no-link
