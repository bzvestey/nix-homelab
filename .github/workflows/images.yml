name: images

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      host:
        description: Canonical host image to build
        required: true
        default: all
        type: choice
        options:
          - all
          - hl-node-00
          - hl-node-01
          - hl-node-02
          - hl-node-03
          - hl-node-04

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      framework_images: ${{ steps.select.outputs.framework_images }}
      pi_images: ${{ steps.select.outputs.pi_images }}
      has_framework_images: ${{ steps.select.outputs.has_framework_images }}
      has_pi_images: ${{ steps.select.outputs.has_pi_images }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI selection
        run: python3 .github/tests/ci-scope.py
      - id: select
        name: Select affected images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-scope.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"

  framework:
    needs: scope
    if: needs.scope.outputs.has_framework_images == 'true'
    name: Framework bootstrap image (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.framework_images) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Test Framework artifact packaging
        run: bash .github/tests/framework-packaging.sh
      - name: Check installers
        run: nix build .#checks.x86_64-linux.installers --out-link result-installers
      - name: Build Framework bootstrap image
        run: nix build ".#images.${{ matrix.host }}" --out-link "result-${{ matrix.host }}"
      - name: Prepare Framework bootstrap artifact
        run: bash .github/scripts/package-framework.sh '${{ matrix.host }}'
      - name: Upload Framework bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host }}-bootstrap-${{ github.sha }}
          path: artifact-${{ matrix.host }}/
          if-no-files-found: error
          retention-days: 7
      - name: Record bootstrap readiness warning
        run: |
          {
            echo '## Framework bootstrap artifact — not installation-ready'
            echo 'Physical disk facts, source evacuation, secret enrollment, and published signed bootstrap policy gates must all be met before installation.'
          } >> "$GITHUB_STEP_SUMMARY"

  raspberry-pi:
    needs: scope
    if: needs.scope.outputs.has_pi_images == 'true'
    name: Raspberry Pi image (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.pi_images) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Build ${{ matrix.host }} image
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/${{ matrix.host }}-build.log"
          set +e
          nix build ".#images.${{ matrix.host }}" --out-link "result-${{ matrix.host }}" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo "## ${{ matrix.host }} native image build failure"
              echo
              echo 'Last 200 lines (bounded to 60,000 bytes):'
              echo '```text'
              tail -n 200 "$log" | tail -c 60000
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 40 "$log" | tail -c 3500)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=%s native image build failure::%s\n' \
              '${{ matrix.host }}' "$diagnostic"
            exit "$status"
          fi
      - name: Prepare observability image artifact
        if: matrix.host == 'hl-node-00'
        run: |
          set -euo pipefail
          output=$(readlink -f result-hl-node-00)
          mapfile -t images < <(find "$output" -type f -name '*.img.zst' -print)
          test "${#images[@]}" -eq 1
          mkdir artifact
          cp -- "${images[0]}" artifact/
          image="artifact/$(basename "${images[0]}")"
          (cd artifact && sha256sum "$(basename "$image")" > hl-node-00.sha256)
          {
            printf 'git_commit=%s\n' "$GITHUB_SHA"
            printf 'nix_output=%s\n' "$output"
            printf 'image_store_path=%s\n' "${images[0]}"
          } > artifact/hl-node-00.manifest
      - name: Upload observability image artifact
        if: matrix.host == 'hl-node-00'
        uses: actions/upload-artifact@v4
        with:
          name: hl-node-00-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
