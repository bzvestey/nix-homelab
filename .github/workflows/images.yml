name: images

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#checks.x86_64-linux.installers .#images.hl-node-02 .#images.hl-node-03 .#images.hl-node-04

  raspberry-pi:
    name: Raspberry Pi image (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host:
          - hl-node-00
          - hl-node-01
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build ${{ matrix.host }} image
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/${{ matrix.host }}-build.log"
          set +e
          nix build ".#images.${{ matrix.host }}" --out-link "result-${{ matrix.host }}" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo "## ${{ matrix.host }} native image build failure"
              echo
              echo 'Last 200 lines (bounded to 60,000 bytes):'
              echo '```text'
              tail -n 200 "$log" | tail -c 60000
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 40 "$log" | tail -c 3500)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=%s native image build failure::%s\n' \
              '${{ matrix.host }}' "$diagnostic"
            exit "$status"
          fi
      - name: Prepare observability image artifact
        if: matrix.host == 'hl-node-00'
        run: |
          set -euo pipefail
          output=$(readlink -f result-hl-node-00)
          mapfile -t images < <(find "$output" -type f -name '*.img.zst' -print)
          test "${#images[@]}" -eq 1
          mkdir artifact
          cp -- "${images[0]}" artifact/
          image="artifact/$(basename "${images[0]}")"
          (cd artifact && sha256sum "$(basename "$image")" > hl-node-00.sha256)
          {
            printf 'git_commit=%s\n' "$GITHUB_SHA"
            printf 'nix_output=%s\n' "$output"
            printf 'image_store_path=%s\n' "${images[0]}"
          } > artifact/hl-node-00.manifest
      - name: Upload observability image artifact
        if: matrix.host == 'hl-node-00'
        uses: actions/upload-artifact@v4
        with:
          name: hl-node-00-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
