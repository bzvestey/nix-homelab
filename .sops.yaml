  - &hl-node-04 age1qdgzv4wywfyds8qqul4s5vnpr72h5s9y46ghssq87dje9f6s4ekqpe4g9n

# Enrollment adds public host recipients here, using the exact anchor printed
# by fleet-enroll. Never add private keys or generated credentials.

creation_rules:
  # Add one rule per enrolled host. Keep the administrator and only that host.
  - path_regex: secrets/hosts/hl-node-00/.*\.yaml$
    key_groups:
      - age: [*administrator, *hl-node-00]

  - path_regex: secrets/hosts/hl-node-01/.*\.yaml$
    key_groups:
      - age: [*administrator, *hl-node-01]

  - path_regex: secrets/hosts/hl-node-02/.*\.yaml$
    key_groups:
      - age: [*administrator, *hl-node-02]

  - path_regex: secrets/hosts/hl-node-03/.*\.yaml$
    key_groups:
      - age: [*administrator, *hl-node-03]

  - path_regex: secrets/hosts/hl-node-04/.*\.yaml$
    key_groups:
      - age: [*administrator, *hl-node-04]

  # Connector credentials are readable only by the administrator and enrolled
  # Raspberry Pi hosts. Add their canonical node anchors after enrollment.
  - path_regex: secrets/pi-connectors/.*\.yaml$
    key_groups:
      - age: [*administrator, *hl-node-00]

  # Runner credentials are readable only by the administrator and enrolled
  # Framework hosts. Add their anchors after enrollment.
  - path_regex: secrets/framework-runners/.*\.yaml$
    key_groups:
      - age: [*administrator, *hl-node-02]
